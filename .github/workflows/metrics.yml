name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Calendrier isométrique
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
          config_timezone: Europe/Paris

      # 2. Langages (dépôts persos + organisation)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          repositories_affiliations: owner, organization_member
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          # Par défaut l'analyse s'arrête après 15 min (7,5 min par dépôt) et ignore en silence
          # les dépôts restants : on lui laisse le temps maximal pour tout analyser.
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          filename: github-languages.svg
          config_timezone: Europe/Paris
