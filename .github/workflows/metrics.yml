name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Calendrier isométrique
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
          config_timezone: Europe/Paris

      # Les cartes github-languages.svg et github-loc.svg ne sont plus générées ici :
      # elles viennent du script local github-metrics/main.py, qui lit tout l'historique
      # (dépôts privés compris) là où l'analyse « indepth » de metrics sautait des commits.
